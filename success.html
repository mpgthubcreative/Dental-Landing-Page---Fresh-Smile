<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Received | Fresh Smile</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./query.css">
    <style>
        body {
            /* background: #faf9fa; */
            font-family: 'Inter', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .success-container {
            max-width: 480px;
            margin: 40px auto 0 auto;
            background: #fff;
            border-radius: 0;
            padding: 0 0 40px 0;
            text-align: center;
        }
        .success-logo {
            width: 220px;
            margin-top: 32px;
            margin-bottom: 32px;
        }
        .success-title {
            font-family: 'Playfair Display', serif;
            color: #7c3ea6;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 24px;
        }
        .success-message {
            color: #444;
            font-size: 1.18rem;
            margin-bottom: 36px;
            line-height: 1.5;
        }
        .success-actions {
            border: 2px solid #a77ac7;
            border-radius: 4px;
            padding: 22px 0 10px 0;
            margin: 0 32px;
            background: #faf9fa;
        }
        .success-actions .book-link {
            display: block;
            color: #222;
            font-weight: 600;
            font-size: 1.25rem;
            margin-bottom: 8px;
            text-decoration: none;
        }
        .success-actions .home-link {
            display: block;
            color: #7c3ea6;
            font-size: 1.1rem;
            text-decoration: underline;
            font-weight: 400;
        }
        @media (max-width: 600px) {
            .success-container {
                max-width: 98vw;
                margin: 0;
                border-radius: 0;
            }
            .success-actions {
                margin: 0 8px;
            }
        }
    </style>
</head>
<body>
    <div class="success-container">
        <img src="./Web Assets - Home/top-logo.png" alt="Fresh Smile Dental Clinic Logo" class="success-logo">
        <div class="success-title">Thank You, We’ve<br>Received Your Message</div>
        <div class="success-message">
            We’ve received your message and will get back to you as soon as possible.<br>
            Please keep your phone line and email open for our response.
        </div>
        <div class="success-actions">
            <a href="https://freshsmile.setmore.com" target="_blank" class="book-link">Ready to book a schedule?</a>
            <a href="./index.html" class="home-link">Back to home</a>
        </div>
    </div>
</body>
</html>
