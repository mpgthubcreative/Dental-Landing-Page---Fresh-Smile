<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./query.css">
    <script defer src="./script.js"></script>

    <title>Fresh Smile</title>

    </head>
<body>

     <div class="container">
        

    <header>
        <a href="./index.html"><img class="top-logo" src="./Web Assets - Home/top-logo.png" alt="Fresh Smile care logo"></a>
    </header>


   

            <div class="grid-container">

                <div class="form-cta-headerbox">
                    <h2 class="contact-us-title">Have Questions?<br>We’re Here To Help</h2>
                    <p class="contact-us-text">Send us your inquiry and our friendly staff will be happy to assist you.</p>
                </div>


                <section class="contact-section">
                    <form class="contact-form" id="contact-form" method="POST" data-netlify="true" name="booking" netlify-honeypot="bot-field">
                        <input type="hidden" name="form-name" value="booking" />
                        <input type="hidden" name="bot-field" />
                        <label>Full Name*<br>
                            <input type="text" name="fullname" required>
                        </label>
                        <label>Email Address*<br>
                            <input type="email" name="email" required>
                        </label>
                        <label>Mobile Number*<br>
                            <input type="tel" name="mobile" value="+63" required>
                        </label>
                        <label>Message*<br>
                            <textarea name="message" placeholder="Type Here.." required></textarea>
                        </label>
                        <button type="submit">Submit</button>
                    </form>
                </section>


                <section class="contact-us-box">
                    <div class="contact-us-content">
                        <p class="contact-us-label"> <span> Visit us at: </span></p>
                        <p>134 Roosevelt Avenue, San Francisco Del Monte, Quezon City</p>
                        <p class="contact-us-label"> <span> Clinic Hours </span></p>
                        <p>Monday to Saturday – 9:00 AM to 6:00 PM</p>

                        <div class="details-contact-us">
                        <div class="contact-us-icon-row First">
                            <span class="contact-us-icon">📞</span>
                            <span class="contact-us-info">(123) 456-7890</span>
                        </div>

                        <div class="contact-us-icon-row">
                            <span class="contact-us-icon">✉️</span>
                            <span class="contact-us-info">info@freshsmiledental.com</span>
                        </div>
                        </div>

                    </div>
                </section>
            </div>  

    </div>


</body>
</html>
